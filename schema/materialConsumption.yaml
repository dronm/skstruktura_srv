name: MaterialConsumption
comment: MaterialConsumption describes a material consumption document.
humanName: material consumption
humanNamePlural: material consumptions

table:
  schema: public
  name: material_consumptions
  comment: Material consumption document headers.

route: /material-consumptions
permissionPrefix: materialConsumption
serviceName: MaterialConsumption
sessionRequired: true
crudNotifications: true

keys:
  - name: id
    pathName: id
    type: int

fields:
  - name: id
    type: int
    primaryKey: true
    autoIncrement: true
    serverGenerated: true

  - name: date
    type: date
    required: true
    comment: Document date and time.

  - name: construction_site_id
    type: int
    required: true
    references:
      schema: public
      table: construction_sites
      column: id
      onDelete: RESTRICT
      onUpdate: CASCADE
    comment: Construction site consuming the materials.

  - name: comment
    type: text
    nullable: true
    comment: Optional document comment.

  - name: version
    type: int
    sqlType: bigint
    required: true
    dbRequired: true
    serverGenerated: true
    default: "1"
    comment: Optimistic concurrency version.

list:
  model: MaterialConsumptionList
  table:
    schema: public
    name: material_consumptions_list
  fields:
  - name: id
    type: int
    primaryKey: true
  - name: date
    type: date
    required: true
  - name: construction_site_id
    type: int
    required: true
  - name: comment
    type: text
    nullable: true
  - name: version
    type: int
    required: true
  - name: construction_site
    type: jsonb
    goType: '*Ref'

crud:
  create: true
  list: true
  detail: true
  update: true
  delete: true

service:
  manualMethods:
    - detail
    - create
    - update
    - delete

permissions:
  enabled: true
  grantRoles:
    - admin
  descriptions:
    create: Создание списания материалов
    list: Просмотр списка списаний материалов
    detail: Просмотр списания материалов
    update: Изменение списания материалов
    delete: Удаление списания материалов

applicationRoute:
  enabled: true
  name: materialConsumptions
  path: /material-consumptions
  description: Списания материалов
  section: Документы
  icon: pi pi-upload
  menuAvailable: true

menu:
  enabled: true
  role: admin
  caption: Списания материалов
  sortOrder: 20
  parent:
    caption: Материалы
    sortOrder: 40
    create: true

frontend:
  scaffold: true
  title: Списания материалов
  form:
    columns: 2
    createTitle: Новое списание материалов
    editTitle: Списание материалов
    copyTitle: Копия списания материалов
    fields:
      - field: date
        label: Дата
        component: DatePicker
        componentImport: primevue/datepicker
        autofocus: true

      - field: construction_site_id
        label: Объект строительства
        component: number

      - field: comment
        label: Комментарий
        component: textarea
        columnSpan: 2

  list:
    pageSize: 30
    columns:
      - field: id
        label: ID
        width: 8rem

      - field: date
        label: Дата
        width: 10rem

      - field: construction_site_id
        label: Объект строительства
        width: 12rem

  routes:
    listName: materialConsumptions
    createName: materialConsumptionCreate
    editName: materialConsumptionEdit

migration:
  enabled: true

test:
  enabled: false
